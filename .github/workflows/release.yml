name: Release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - uses: extractions/setup-just@v3

      - name: Verify tag and package version
        if: github.ref_type == 'tag'
        run: |
          package_version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test -n "$package_version"
          test "v$package_version" = "$GITHUB_REF_NAME"
          grep -q "^## \[$package_version\]" CHANGELOG.md

      - name: Install development dependencies
        run: uv sync --frozen

      - name: Check source
        run: just check

      - name: Build wheel and source distribution
        run: uv build

      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  verify:
    name: install built wheel
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install wheel into a clean environment
        run: |
          wheel=$(find dist -name '*.whl' -type f -print -quit)
          test -n "$wheel"
          uv venv release-venv
          uv pip install --python release-venv/bin/python "$wheel"
          release-venv/bin/python - <<'PY'
          import pollux

          expected = {
              "Config",
              "Environment",
              "Input",
              "Output",
              "Source",
              "defer",
              "interact",
              "run",
              "run_many",
              "stream",
          }
          missing = expected.difference(pollux.__all__)
          if missing:
              raise SystemExit(f"wheel is missing public exports: {sorted(missing)}")
          print(f"verified pollux-ai {pollux.__version__}")
          PY

  publish:
    name: publish release
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pollux-ai/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Read release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
