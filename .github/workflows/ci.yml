# Runs quality checks on active branches and outside contributions.
name: Continuous Integration

"on":
  push:
    branches: [main, v1, "release/**"]
  pull_request:
    branches: [main, v1, "release/**"]
  # Run API tests nightly to detect provider-side drift during quiet periods
  schedule:
    - cron: "0 8 * * *" # 8am UTC daily

jobs:
  lint-workflows:
    name: Lint Workflow Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: devops-actions/actionlint@v0.1.10

  quality-checks:
    # Runs in parallel with lint-workflows (no dependency)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit
    with:
      python-version: ${{ matrix.python-version }}
      test-command: just test
      enable-api-tests: false
      # Upload coverage from a single matrix entry to avoid duplicate Codecov reports.
      upload-coverage: ${{ matrix.python-version == '3.13' }}

  api-tests:
    # Run API tests exactly once to avoid exhausting shared quota.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit
    with:
      python-version: "3.10"
      test-command: just test-api
      enable-api-tests: true
      upload-coverage: false
